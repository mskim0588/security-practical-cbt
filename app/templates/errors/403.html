{% extends "base.html" %}

{% block title %}403 접근 권한 오류 | 정보보안기사 실기 CBT{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 48px 24px; max-width: 640px; margin: 40px auto;">
  <div style="font-size: 56px; margin-bottom: 16px;">🛡️</div>
  <h1 style="font-size: 24px; font-weight: 800; color: var(--danger-color); margin-bottom: 12px;">
    403 Forbidden - 보안 검증(CSRF) 실패
  </h1>
  <p style="font-size: 15px; color: var(--neutral-700); line-height: 1.6; margin-bottom: 24px;">
    {{ error_message or "요청의 보안 토큰(CSRF Token)이 유효하지 않거나 누락되었습니다.<br>비정상적인 요청이거나 브라우저 세션이 만료되었을 수 있습니다." }}
  </p>
  <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
    <a href="/" class="btn btn-secondary">홈으로 이동</a>
    <a href="/dashboard" class="btn btn-secondary">대시보드</a>
    <a href="/exam" class="btn btn-primary">새 모의고사 시작</a>
  </div>
</div>
{% endblock %}
