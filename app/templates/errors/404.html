{% extends "base.html" %}

{% block title %}페이지를 찾을 수 없습니다 (404) | 정보보안기사 실기 CBT{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 60px 20px; max-width: 600px; margin: 40px auto;">
  <div style="font-size: 56px; margin-bottom: 16px;">🔍</div>
  <h1 style="font-size: 24px; font-weight: 800; color: var(--neutral-900); margin-bottom: 10px;">
    요청하신 페이지를 찾을 수 없습니다
  </h1>
  <p style="font-size: 14px; color: var(--neutral-600); margin-bottom: 24px; line-height: 1.6;">
    입력하신 주소가 잘못되었거나, 요청하신 회차 또는 문항/개념 데이터가 존재하지 않습니다.<br>
    메인 홈이나 모의고사 화면으로 이동해 보세요.
  </p>
  <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
    <a href="/" class="btn btn-secondary btn-lg">&larr; 홈으로 이동</a>
    <a href="/exam" class="btn btn-primary btn-lg">모의고사 응시 &rarr;</a>
    <a href="/concepts" class="btn btn-secondary btn-lg">개념학습 둘러보기</a>
  </div>
</div>
{% endblock %}
